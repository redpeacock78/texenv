name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  shellspec:
    name: shellspec (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install bash (macos)
        if: matrix.os == 'macos-latest'
        run: brew install bash

      - name: Install shellspec
        env:
          SHELLSPEC_VERSION: "0.28.1"
          SHELLSPEC_SHA256: "400d835466429a5fe6c77a62775a9173729d61dd43e05dfa893e8cf6cb511783"
        run: |
          archive="${RUNNER_TEMP}/shellspec-${SHELLSPEC_VERSION}.tar.gz"
          curl -fsSL "https://github.com/shellspec/shellspec/archive/refs/tags/${SHELLSPEC_VERSION}.tar.gz" \
            -o "${archive}"
          if command -v sha256sum >/dev/null 2>&1; then
            printf '%s  %s\n' "${SHELLSPEC_SHA256}" "${archive}" | sha256sum -c -
          else
            printf '%s  %s\n' "${SHELLSPEC_SHA256}" "${archive}" | shasum -a 256 -c -
          fi
          tar -xz -C "${HOME}" -f "${archive}"
          ln -s "${HOME}/shellspec-${SHELLSPEC_VERSION}/shellspec" "${HOME}/.local/bin/shellspec" 2>/dev/null \
            || { mkdir -p "${HOME}/.local/bin" && ln -s "${HOME}/shellspec-${SHELLSPEC_VERSION}/shellspec" "${HOME}/.local/bin/shellspec"; }
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install kcov (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          if apt-cache show kcov >/dev/null 2>&1; then
            sudo apt-get install -y kcov
          else
            echo 'kcov is not available in the Ubuntu runner repositories; continuing without coverage.'
          fi
        continue-on-error: true

      - name: Install kcov (macos)
        if: matrix.os == 'macos-latest'
        run: brew install kcov
        continue-on-error: true

      - name: Run shellspec (with kcov when available)
        run: |
          if command -v kcov >/dev/null 2>&1; then
            shellspec --kcov
          else
            shellspec
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          if-no-files-found: ignore
